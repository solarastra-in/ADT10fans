<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yasBlueBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#0e2a6b"/>
      <stop offset="100%" stop-color="#071333"/>
    </linearGradient>
    <linearGradient id="lionGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="lionText3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="lionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#facc15" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M 250 20 C 390 20 440 70 440 160 C 440 315 350 425 250 480 C 150 425 60 315 60 160 C 60 70 110 20 250 20 Z"
        fill="url(#yasBlueBg)" stroke="url(#lionGold)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Background Diagonal Stripes pattern in Shield -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="8">
    <line x1="80" y1="100" x2="220" y2="40"/>
    <line x1="90" y1="180" x2="300" y2="60"/>
    <line x1="120" y1="260" x2="380" y2="100"/>
    <line x1="170" y1="340" x2="420" y2="180"/>
  </g>

  <!-- 5-Pointed Royal Crown -->
  <g id="crown" filter="url(#lionGlow)">
    <polygon points="275,60 295,115 325,75 345,120 375,65 370,140 260,135" fill="url(#lionGold)" stroke="#78350f" stroke-width="2"/>
    <circle cx="275" cy="58" r="4.5" fill="#ffffff"/>
    <circle cx="325" cy="73" r="4.5" fill="#ffffff"/>
    <circle cx="375" cy="63" r="4.5" fill="#ffffff"/>
    <!-- Crown Jewels -->
    <circle cx="295" cy="125" r="3" fill="#ef4444"/>
    <circle cx="320" cy="125" r="3" fill="#3b82f6"/>
    <circle cx="345" cy="125" r="3" fill="#10b981"/>
  </g>

  <!-- Roaring Lion Head Profile (Facing Right) -->
  <g id="lionHead" filter="url(#lionGlow)">
    <!-- Sweeping Mane Outer Layers -->
    <path d="M 120 200 C 145 160 210 120 280 120 C 330 120 365 145 380 180 C 350 170 330 185 320 200 C 360 205 385 235 390 260 C 360 250 340 265 330 280 C 370 290 380 325 365 345 C 330 330 310 335 295 345 C 320 355 330 385 305 400 C 265 375 240 370 205 385 C 220 360 215 340 190 330 C 205 315 200 290 175 285 C 190 265 185 240 160 235 C 175 215 160 195 120 200 Z"
          fill="url(#lionGold)" stroke="#78350f" stroke-width="2"/>

    <!-- Lion Face & Jaw Geometry (Gold + Shading) -->
    <path d="M 235 175 C 275 165 320 180 345 210 L 375 220 C 390 235 385 255 355 260 L 320 260 C 300 265 295 280 330 285 C 360 290 355 315 335 325 C 295 335 270 310 255 280 C 240 250 225 210 235 175 Z"
          fill="#d97706"/>

    <!-- Open Roaring Mouth & Fangs -->
    <path d="M 325 255 C 345 255 365 260 355 275 C 335 285 315 280 305 270 Z" fill="#450a0a"/>
    <!-- Teeth -->
    <polygon points="325,255 330,265 335,255" fill="#ffffff"/>
    <polygon points="345,255 350,267 355,257" fill="#ffffff"/>
    <polygon points="320,278 325,268 330,277" fill="#ffffff"/>
    <polygon points="340,278 345,269 350,277" fill="#ffffff"/>

    <!-- Piercing Eye -->
    <polygon points="285,205 315,208 300,218" fill="#0f172a"/>
    <polygon points="290,207 310,209 300,215" fill="#ffffff"/>
    <circle cx="302" cy="211" r="2.5" fill="#38bdf8"/>

    <!-- Snout & Whiskers Contour -->
    <path d="M 335 225 L 365 230 L 350 240 Z" fill="#1e293b"/>
    <line x1="310" y1="238" x2="275" y2="242" stroke="#78350f" stroke-width="2"/>
    <line x1="315" y1="246" x2="280" y2="253" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Typography Banner Area -->
  <g filter="drop-shadow(0 6px 8px rgba(0,0,0,0.9))">
    <!-- YAS -->
    <text x="220" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="56" fill="url(#lionGold)" stroke="#0f172a" stroke-width="3" letter-spacing="4">
      YAS
    </text>

    <!-- LIONS in 3D Metallic Athletic Block -->
    <text x="250" y="425" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="url(#lionText3D)" stroke="#0c1e4f" stroke-width="12" letter-spacing="3" style="paint-order: stroke fill;">
      LIONS
    </text>
    <text x="250" y="425" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="url(#lionText3D)" stroke="#facc15" stroke-width="3" letter-spacing="3" style="paint-order: stroke fill;">
      LIONS
    </text>
  </g>
</svg>
