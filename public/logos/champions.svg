<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="champCrimsonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="champCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="champGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="champManeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="champGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 250 18 C 390 18 435 68 435 158 C 435 315 350 425 250 482 C 150 425 65 315 65 158 C 65 68 110 18 250 18 Z"
        fill="url(#champCrimsonBg)" stroke="url(#champGold)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Inner Cream Parchment Shield Fill -->
  <path d="M 250 34 C 370 34 415 78 415 158 C 415 305 340 405 250 458 C 160 405 85 305 85 158 C 85 78 130 34 250 34 Z"
        fill="url(#champCream)" stroke="#991b1b" stroke-width="4"/>

  <!-- Sand Dune Horizon Curves in Background -->
  <path d="M 90 280 Q 180 250 280 270 Q 360 285 410 260 L 410 380 Q 330 430 250 455 Q 170 430 90 380 Z"
        fill="#fde68a" opacity="0.6"/>

  <!-- Typography Top Banner: ROYAL DESERT CHAMPIONS -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
    <!-- ROYAL in dark red with stars -->
    <text x="250" y="80" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#991b1b" letter-spacing="8">
      — ROYAL —
    </text>

    <!-- DESERT in bold crimson -->
    <text x="250" y="145" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#b91c1c" letter-spacing="4" stroke="#ffffff" stroke-width="4" style="paint-order: stroke fill;">
      DESERT
    </text>

    <!-- CHAMPIONS curved ribbon text -->
    <text x="250" y="195" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#991b1b" letter-spacing="3" stroke="#fef08a" stroke-width="2" style="paint-order: stroke fill;">
      CHAMPIONS
    </text>
  </g>

  <!-- Noble White Arabian Stallion / Horse Mascot -->
  <g id="stallionMascot" filter="url(#champGlow)">
    <!-- Fiery Red Flowing Mane Spikes (Behind head) -->
    <path d="M 310 240 C 350 230 380 260 395 290 C 370 285 355 295 350 310 C 380 315 390 345 375 370 C 350 360 335 370 325 385 C 345 395 340 425 315 435 C 295 405 285 390 270 380 C 275 350 285 310 275 270 Z"
          fill="url(#champManeRed)"/>

    <!-- Stallion White Muscular Head Profile (Facing Left) -->
    <path d="M 285 240 C 255 220 220 225 190 250 C 165 275 145 310 135 345 C 130 365 140 380 160 380 C 180 380 190 365 195 345 C 210 370 235 395 265 420 L 290 435 C 315 395 320 340 310 290 C 305 270 298 255 285 240 Z"
          fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Ears -->
    <polygon points="275,215 290,245 265,240" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="255,220 270,245 245,242" fill="#e2e8f0"/>

    <!-- Forehead Mane Locks (Flowing in front) -->
    <path d="M 270 235 C 250 245 235 270 240 295 C 248 275 260 260 275 250 Z" fill="#dc2626"/>
    <path d="M 285 255 C 270 275 260 305 268 335 C 275 310 285 290 295 270 Z" fill="#b91c1c"/>

    <!-- Muzzle, Snout & Flared Nostril -->
    <ellipse cx="148" cy="365" rx="8" ry="12" fill="#7f1d1d" transform="rotate(-25 148 365)"/>
    <!-- Mouth Line -->
    <path d="M 145 375 C 160 380 175 378 185 372" fill="none" stroke="#64748b" stroke-width="2.5"/>

    <!-- Intense Crimson/Amber Eye -->
    <polygon points="225,275 245,270 238,285" fill="#7f1d1d"/>
    <circle cx="235" cy="277" r="4.5" fill="#dc2626"/>
    <circle cx="235" cy="277" r="2" fill="#ffffff"/>

    <!-- Cheek & Jawline Shading -->
    <path d="M 195 345 C 215 325 240 320 260 335 C 245 355 225 365 205 360 Z" fill="#e2e8f0" opacity="0.8"/>
  </g>
</svg>
