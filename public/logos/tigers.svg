<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tigerPurpleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#170638"/>
    </linearGradient>
    <linearGradient id="tigerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="tigerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 250 18 C 390 18 435 68 435 158 C 435 315 350 425 250 482 C 150 425 65 315 65 158 C 65 68 110 18 250 18 Z"
        fill="url(#tigerPurpleBg)" stroke="url(#tigerGold)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Subtle Chevron Pattern in Shield -->
  <g opacity="0.12" fill="#c084fc">
    <polygon points="120,60 160,60 250,110 340,60 380,60 250,135"/>
    <polygon points="100,120 140,120 250,180 360,120 400,120 250,205"/>
    <polygon points="90,190 130,190 250,260 370,190 410,190 250,285"/>
  </g>

  <!-- Stylized Tribal Roaring Tiger Head (Facing Left) -->
  <g id="tribalTiger" filter="url(#tigerGlow)">
    <!-- Swirling tribal mane curves in gold & white -->
    <path d="M 330 145 C 310 125 270 120 230 135 C 205 145 180 170 170 195 C 190 185 215 180 240 180 C 275 180 305 195 320 220 C 335 190 345 165 330 145 Z" fill="url(#tigerGold)"/>
    <path d="M 345 170 C 355 195 350 230 330 255 C 345 250 360 235 365 210 C 368 190 360 175 345 170 Z" fill="#ffffff"/>

    <!-- Top Brow & Ear (Tribal Swirls) -->
    <path d="M 285 130 C 270 115 250 115 235 125 C 255 135 270 145 285 160 Z" fill="#ffffff"/>
    <path d="M 215 155 C 190 170 175 195 165 225 C 180 215 200 205 220 200 Z" fill="#ffffff"/>

    <!-- Snout & Roaring Open Jaw -->
    <path d="M 165 225 C 150 235 140 250 145 265 C 155 270 170 265 180 255 L 185 240 Z" fill="url(#tigerGold)"/>
    <path d="M 145 265 C 135 275 140 295 160 305 C 175 295 180 280 180 270 Z" fill="#ffffff"/>

    <!-- Sharp Fangs / Teeth -->
    <polygon points="152,260 157,272 163,260" fill="#ffffff"/>
    <polygon points="158,298 163,286 168,298" fill="#ffffff"/>

    <!-- Lower Jaw & Beard Tufts -->
    <path d="M 160 305 C 175 325 200 335 230 330 C 215 320 205 305 205 290 C 185 295 170 300 160 305 Z" fill="url(#tigerGold)"/>
    <path d="M 230 330 C 265 325 295 305 315 275 C 290 285 265 285 240 280 C 235 300 235 315 230 330 Z" fill="#ffffff"/>

    <!-- Tribal Swirl Neck Fill -->
    <path d="M 245 210 C 235 225 235 245 250 260 C 265 250 270 230 260 215 Z" fill="url(#tigerGold)"/>
    <path d="M 275 225 C 270 240 275 260 290 270 C 300 255 300 235 290 225 Z" fill="#ffffff"/>

    <!-- Eye Area -->
    <polygon points="195,215 215,210 208,225" fill="#facc15"/>
    <circle cx="206" cy="217" r="2" fill="#0f172a"/>
  </g>

  <!-- Typography: United Tigers -->
  <g filter="drop-shadow(0 6px 8px rgba(0,0,0,0.9))">
    <!-- United in modern italic white -->
    <text x="250" y="380" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="3" stroke="#1e1035" stroke-width="4" style="paint-order: stroke fill;">
      United
    </text>

    <!-- Tigers in bold athletic gold -->
    <text x="250" y="440" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="68" fill="url(#tigerGold)" letter-spacing="5" stroke="#170638" stroke-width="8" style="paint-order: stroke fill;">
      TIGERS
    </text>
  </g>
</svg>
