<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="acesWineBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c24"/>
      <stop offset="50%" stop-color="#3b0813"/>
      <stop offset="100%" stop-color="#1f0309"/>
    </linearGradient>
    <linearGradient id="acesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="acesLightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="acesGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 250 18 C 390 18 435 68 435 158 C 435 315 350 425 250 482 C 150 425 65 315 65 158 C 65 68 110 18 250 18 Z"
        fill="url(#acesWineBg)" stroke="url(#acesGold)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Inner Ornate Arabesque Arch Lines -->
  <path d="M 250 36 C 365 36 415 80 415 160 C 415 305 340 405 250 455 C 160 405 85 305 85 160 C 85 80 135 36 250 36 Z"
        fill="none" stroke="#721c24" stroke-width="3" opacity="0.8"/>

  <!-- Symmetrical Spreading Golden Wings & Ace Emblem -->
  <g id="acesEmblem" filter="url(#acesGlow)">
    <!-- Crown Dome Arch Peak -->
    <path d="M 250 50 C 265 65 275 85 275 105 C 260 105 250 95 250 85 C 250 95 240 105 225 105 C 225 85 235 65 250 50 Z"
          fill="url(#acesGold)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Left Spreading Wing Feathers -->
    <g fill="url(#acesGold)" stroke="#78350f" stroke-width="1.5">
      <!-- Top Primary Feather -->
      <path d="M 245 95 C 215 85 155 90 90 135 C 130 145 185 130 235 120 Z"/>
      <!-- Second Feather -->
      <path d="M 235 120 C 190 118 140 135 95 175 C 135 178 180 160 230 145 Z"/>
      <!-- Third Feather -->
      <path d="M 230 145 C 185 150 145 175 105 215 C 145 210 185 190 230 170 Z"/>
      <!-- Fourth Feather -->
      <path d="M 230 170 C 190 185 155 215 125 255 C 160 240 195 215 235 195 Z"/>
      <!-- Fifth Feather -->
      <path d="M 235 195 C 205 215 175 245 155 285 C 185 265 215 240 240 220 Z"/>
    </g>

    <!-- Right Spreading Wing Feathers (Mirrored) -->
    <g fill="url(#acesGold)" stroke="#78350f" stroke-width="1.5">
      <!-- Top Primary Feather -->
      <path d="M 255 95 C 285 85 345 90 410 135 C 370 145 315 130 265 120 Z"/>
      <!-- Second Feather -->
      <path d="M 265 120 C 310 118 360 135 405 175 C 365 178 320 160 270 145 Z"/>
      <!-- Third Feather -->
      <path d="M 270 145 C 315 150 355 175 395 215 C 355 210 315 190 270 170 Z"/>
      <!-- Fourth Feather -->
      <path d="M 270 170 C 310 185 345 215 375 255 C 340 240 305 215 265 195 Z"/>
      <!-- Fifth Feather -->
      <path d="M 265 195 C 295 215 325 245 345 285 C 315 265 285 240 260 220 Z"/>
    </g>

    <!-- Center Ace of Spades Crest -->
    <g id="centerSpade">
      <!-- Heart lobes of spade -->
      <path d="M 250 110 C 275 145 305 185 295 215 C 285 240 260 240 250 225 C 240 240 215 240 205 215 C 195 185 225 145 250 110 Z"
            fill="url(#acesLightGold)" stroke="#78350f" stroke-width="2"/>
      <!-- Stem of spade -->
      <path d="M 245 220 L 255 220 L 265 250 L 235 250 Z" fill="url(#acesLightGold)" stroke="#78350f" stroke-width="2"/>
      <!-- Crown on Spade -->
      <polygon points="240,145 245,135 250,142 255,135 260,145 250,150" fill="#78350f"/>
    </g>
  </g>

  <!-- Typography: ARABIAN ACES -->
  <g filter="drop-shadow(0 6px 8px rgba(0,0,0,0.95))">
    <!-- ARABIAN in curved arched gold scroll -->
    <text x="250" y="340" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="url(#acesGold)" letter-spacing="8" stroke="#1f0309" stroke-width="3" style="paint-order: stroke fill;">
      ARABIAN
    </text>

    <!-- ACES in dimensional embossed metallic gold -->
    <text x="250" y="420" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#acesLightGold)" stroke="#78350f" stroke-width="12" letter-spacing="6" style="paint-order: stroke fill;">
      ACES
    </text>
    <text x="250" y="420" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#acesLightGold)" stroke="#fef08a" stroke-width="2" letter-spacing="6" style="paint-order: stroke fill;">
      ACES
    </text>
  </g>
</svg>
