<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bullShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f3d"/>
      <stop offset="60%" stop-color="#0c1327"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <linearGradient id="bullFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b3d"/>
      <stop offset="50%" stop-color="#f04318"/>
      <stop offset="100%" stop-color="#ba2306"/>
    </linearGradient>
    <linearGradient id="bullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bullHornGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="bullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f04318" flood-opacity="0.35"/>
    </filter>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow -->
  <path d="M 250 18 C 390 18 435 65 435 155 C 435 310 355 425 250 482 C 145 425 65 310 65 155 C 65 65 110 18 250 18 Z"
        fill="url(#bullShieldBg)" stroke="url(#bullGoldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#shieldShadow)"/>

  <!-- Inner Shield Border -->
  <path d="M 250 32 C 375 32 418 72 418 155 C 418 298 345 408 250 460 C 155 408 82 298 82 155 C 82 72 125 32 250 32 Z"
        fill="none" stroke="#25355e" stroke-width="3" opacity="0.8"/>

  <!-- Stars around UAE -->
  <g fill="url(#bullGoldGrad)">
    <polygon points="120,80 123,86 130,87 125,92 126,99 120,95 114,99 115,92 110,87 117,86" transform="scale(0.8) translate(30, 20)"/>
    <polygon points="380,80 383,86 390,87 385,92 386,99 380,95 374,99 375,92 370,87 377,86" transform="scale(0.8) translate(95, 20)"/>
  </g>

  <!-- Typography: U.A.E -->
  <text x="250" y="105" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="14">
    U . A . E
  </text>

  <!-- Typography: BULLS -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.8))">
    <path d="M 125 185 Q 250 160 375 185 L 368 215 Q 250 190 132 215 Z" fill="#0b1122" opacity="0.6"/>
    <text x="250" y="205" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="4" stroke="#0c142c" stroke-width="3" style="paint-order: stroke fill;">
      BULLS
    </text>
  </g>

  <!-- Mascot: Charging Bull Head -->
  <g id="bullMascot" filter="url(#bullGlow)">
    <!-- Horns -->
    <!-- Left Horn -->
    <path d="M 195 240 C 150 235 120 220 100 185 C 120 180 155 200 190 225 Z" fill="url(#bullHornGrad)" stroke="#64748b" stroke-width="2"/>
    <path d="M 195 240 C 140 238 105 215 95 180 C 115 178 150 198 190 228 Z" fill="#ffffff"/>
    
    <!-- Right Horn -->
    <path d="M 305 240 C 350 235 380 220 400 185 C 380 180 345 200 310 225 Z" fill="url(#bullHornGrad)" stroke="#64748b" stroke-width="2"/>
    <path d="M 305 240 C 360 238 395 215 405 180 C 385 178 350 198 310 228 Z" fill="#ffffff"/>

    <!-- Ears -->
    <path d="M 175 250 C 130 255 110 270 120 285 C 145 285 170 270 182 258 Z" fill="#b91c1c"/>
    <path d="M 325 250 C 370 255 390 270 380 285 C 355 285 330 270 318 258 Z" fill="#b91c1c"/>

    <!-- Bull Head Main Silhouette -->
    <path d="M 190 225 C 220 215 280 215 310 225 C 335 245 355 290 350 340 C 345 385 310 425 280 435 L 220 435 C 190 425 155 385 150 340 C 145 290 165 245 190 225 Z"
          fill="url(#bullFaceGrad)"/>

    <!-- Muscular Forehead / Shadow Accents -->
    <path d="M 215 228 L 250 265 L 285 228 C 300 245 315 275 315 305 C 285 295 250 315 215 295 C 185 305 185 275 200 245 Z" fill="#991b1b" opacity="0.6"/>
    
    <!-- Eyebrows / Furrowed Ridge -->
    <polygon points="175,275 240,295 220,310 170,285" fill="#7f1d1d"/>
    <polygon points="325,275 260,295 280,310 330,285" fill="#7f1d1d"/>

    <!-- Eyes -->
    <ellipse cx="205" cy="292" rx="14" ry="9" fill="#0f172a" transform="rotate(10 205 292)"/>
    <circle cx="203" cy="291" r="5" fill="#38bdf8"/>
    <circle cx="202" cy="290" r="2" fill="#ffffff"/>

    <ellipse cx="295" cy="292" rx="14" ry="9" fill="#0f172a" transform="rotate(-10 295 292)"/>
    <circle cx="297" cy="291" r="5" fill="#38bdf8"/>
    <circle cx="298" cy="290" r="2" fill="#ffffff"/>

    <!-- Snout & Muzzle -->
    <path d="M 195 345 C 205 330 295 330 305 345 C 320 375 325 415 295 435 C 275 442 225 442 205 435 C 175 415 180 375 195 345 Z"
          fill="#ea580c"/>
    <path d="M 210 360 C 230 350 270 350 290 360 C 305 385 300 420 280 432 C 265 438 235 438 220 432 C 200 420 195 385 210 360 Z"
          fill="#c2410c"/>

    <!-- Nostrils -->
    <ellipse cx="225" cy="385" rx="11" ry="16" fill="#450a0a" transform="rotate(-15 225 385)"/>
    <ellipse cx="275" cy="385" rx="11" ry="16" fill="#450a0a" transform="rotate(15 275 385)"/>

    <!-- Golden Nose Ring -->
    <ellipse cx="250" cy="415" rx="30" ry="24" fill="none" stroke="url(#bullGoldGrad)" stroke-width="12" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.7))"/>
    <path d="M 230 405 C 230 400 270 400 270 405" fill="none" stroke="#78350f" stroke-width="6"/>
  </g>
</svg>
