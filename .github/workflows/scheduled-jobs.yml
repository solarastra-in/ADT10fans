# Optional. The site already runs its scheduled jobs (Dream XI lock reminders, live scores, feed pulls)
# after visits. This also nudges it every 10 minutes for quiet periods.
# Repository settings > Secrets and variables > Actions > Variables: APP_URL, e.g. https://fans.example.com
# (Optional secret CRON_SECRET, matching Admin > Environment, lets it force a run.)
name: Scheduled jobs
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run scheduled jobs
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository variable to enable this schedule."; exit 0; fi
          curl -fsS --max-time 120 -X POST ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} "$APP_URL/api/cron/run"
