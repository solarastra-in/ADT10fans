# Type-checks and runs every end-to-end suite (API journeys, shared storage, production build,
# phone-width browser journeys) on each push and pull request.
name: CI
on:
  push:
    branches: [main, fan-platform-v2]
  pull_request: {}
jobs:
  test:
    # Pinned: ubuntu-latest moved to Ubuntu 26, where Playwright 1.50 can't install Chromium's system packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Some editors push the project without its lockfile; install either way.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run lint
      - name: Install Chromium for the browser tests
        run: npx -y playwright@1.50.1 install --with-deps chromium
      - name: End-to-end tests
        run: |
          export CHROMIUM_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)
          npm run test:all 2>&1 | tee e2e.log
          exit ${PIPESTATUS[0]}
      - name: Vercel function starts and serves pages
        run: npm run test:vercel
      - name: Report failures
        if: failure()
        run: |
          grep -nE "✗|Error|failed|did not start|Timeout" e2e.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          echo "::error::tail: $(tail -40 e2e.log | tr '\n' '|' | cut -c1-4000)"
